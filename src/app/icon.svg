<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="raBadgeBg" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#5c2417" />
      <stop offset="100%" stop-color="#2b0f08" />
    </radialGradient>
    <linearGradient id="raChili" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ff5a3c" />
      <stop offset="55%" stop-color="#e2361a" />
      <stop offset="100%" stop-color="#a8180a" />
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#raBadgeBg)" />
  <circle cx="50" cy="50" r="43" fill="none" stroke="#f5a831" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- stem / calyx -->
  <path d="M46 22 L54 22 L52 30 L48 30 Z" fill="#6fae44" />
